<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Abhay Pratap Singh">
    <title>Question 6 - CSS Transformations</title>
    <link rel="stylesheet" href="style06.css">
</head>
<body>
    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to see its transformation</p>
    </header>

    <main class="transform-row">
        <div class="item">
            <div class="box box-rotate">1</div>
            <p class="label">rotate(45deg)</p>
        </div>

        <div class="item">
            <div class="box box-scale">2</div>
            <p class="label">scale(1.2)</p>
        </div>

        <div class="item">
            <div class="box box-translate">3</div>
            <p class="label">translate(10px, -10px)</p>
        </div>

        <div class="item">
            <div class="box box-skew">4</div>
            <p class="label">skew(10deg, 5deg)</p>
        </div>
    </main>

    <footer>
        <p>Assignment 7 - Question 6 | Abhay Pratap Singh</p>
    </footer>
</body>
</html>
