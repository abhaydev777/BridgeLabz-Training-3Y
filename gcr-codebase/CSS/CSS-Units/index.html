<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }

        h3 {
            font-size: 20px;
            text-decoration: underline;
        }

        .box {
            border: 2px solid red;
            width: 50%;
            height: 10%;
            font-size: 20px;
            text-align: center;
        }

        .parent {
            border: 2px solid red;
            background-color: yellow;
            width: 50%;
            height: 10%;
        }

        .child {
            border: 1px solid green;
            background-color: blue;
            width: 50%;
            height: 100%;
            color: white;
            font-size: 20px;
            text-align: center;
        }
        /* vw, vh */

        .container {
            border: 1px solid green;
            background-color: darkblue;
            color: #fff;
            font-size: 40px;
            text-align: center;
            width: 100vw;
            height: 50vh;
        }

        /* px */
        .box1 {
            border: 1px solid black;
            font-size: 50px;
        }

        .parent2 {
            font-size: 10px;
        }
        
        .child2 {
            font-size: 5em; 
            /* 5em = 50px -> 5em x 10px = 50px*/

        }

        /* rem */
        .parent3 {
            font-size: 10px;
        }
        
        .child3 {
            font-size: 5rem; 
            /* 5em = 80px -> 5rem x 16px = 80px*/

        }
    </style>
</head>
<body>
    <!-- % -->
     <h3>Units-%</h3>
    <div class="box">
        Welcome to BridgeLabz
    </div>
    <div class="parent">
        <div class="child">
            Child
        </div>
    </div>
    <br/>
    <br/>

    <!-- vw, vh -->
     <h3>Units-vw, vh</h3>
     <div class="container">
        Welcome to Full Stack Session
     </div>

     <br/>
    <br/>

     <!-- px -->
      <h3>Units-px</h3>
     <div class="box1">
        Abhay Pratap Singh
     </div>

     <br/>
    <br/>

     <!-- em, rem -> root element -->
      <h3>Units - em</h3>
      <div class="parent2">
        Hello em
      </div>
      <div class="child2">
        Child em
      </div>

      <h3>Units - rem</h3>
      <div class="parent3">
        Hello rem
      </div>
      <div class="child3">
        Child rem
      </div>
</body>
</html>
