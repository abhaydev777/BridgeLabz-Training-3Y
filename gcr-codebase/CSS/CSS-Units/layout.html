<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Layout</title>
    <style>
        span {
            border: 2px solid black;
            padding: 2px 8px;
            border-radius: 10px;
            width: 600px;
            height: 200px;
            display: block;
        }
        p {
            display: inline;
            border: 2px solid black;
            padding: 2px 8px;
            border-radius: 10px;
        }

        h2 {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div>
        Welcome to GLA University.
        <span>span element <p>This is Paragraph</p> <h2>This is a Inline-Block Element</h2></span>
        
    </div>
    <h2>This is a Inline-Block Element</h2
</body>
</html>
