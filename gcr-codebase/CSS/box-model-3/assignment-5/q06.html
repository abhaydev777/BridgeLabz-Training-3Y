<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments Gallery</title>
    <link rel="stylesheet" href="style06.css">
</head>
<body>
    <main class="gallery-page">
        <header class="gallery-heading">
            <p class="eyebrow">A visual collection</p>
            <h1>Moments worth remembering</h1>
            <p>Hover over an image to see its caption.</p>
        </header>
        <section class="gallery" aria-label="Photo gallery">
            <figure class="gallery-card"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape"><figcaption>Morning in the mountains</figcaption></figure>
            <figure class="gallery-card"><img src="https://images.unsplash.com/photo-150752?auto=format&fit=crop&w=900&q=80" alt="Ocean waves at a beach"><figcaption>Blue horizon</figcaption></figure>
            <figure class="gallery-card"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight through a forest"><figcaption>Forest light</figcaption></figure>
            <figure class="gallery-card"><img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Green valley and hills"><figcaption>Open valleys</figcaption></figure>
            <figure class="gallery-card"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Person standing near a lake"><figcaption>A quiet pause</figcaption></figure>
            <figure class="gallery-card"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Cabin beside a lake"><figcaption>Weekend retreat</figcaption></figure>
        </section>
    </main>
</body>
</html>
