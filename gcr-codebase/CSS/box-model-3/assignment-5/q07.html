<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Abhay</title>
    <link rel="stylesheet" href="style07.css">
</head>
<body>
    <main class="contact-page">
        <form class="contact-form" action="#" method="post">
            <p class="eyebrow">Let's connect</p>
            <h1>Send a message</h1>
            <p class="intro">Have a question or a project idea? Write a few lines below.</p>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" placeholder="How can I help?" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message" required></textarea>
            <button type="submit">Send message</button>
        </form>
    </main>
</body>
</html>
