<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-model-HTML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            background: #F9F5F0;
        }

        .header {
            background-color: #FF6C2D;
            width: 200px;
            height: 200px;
            color: #fff;
            /* border-style: solid;
            border-color: black;
            border-width: 4px; */
            border: 1px solid #000;
            /* border-radius: 30px; */
            border-top-left-radius: 40px;
            border-bottom-right-radius: 40px;
            padding: 10px 10px;
        }

        #para-1 {
            background: #FF6C2D;
            width: 200px;
            height: 200px;
            color: #fff;
            border: 1px solid #000;
            border-radius: 30px;
            padding: 10px 10px;
            margin: 20px 100px;
        }

        #para-2 {
            background: #FF6C2D;
            color: #fff;
            width: 200px;
            height: 200px;
            border: 1px solid #000;
            border-radius: 30px;
            /* padding: 10px 20px; */
            padding: 10px 10px 10px 10px; /* clock wise  */
        }

        #para-3 {
            background: #FF6C2D;
            width: 200px;
            height: 200px;
            color: #fff;
            border: 1px solid #000;
            border-radius: 30px;
            padding: 10px 10px;
        }
    </style>
</head>
<body>
    <h1 class="header">Welcome to BridgeLabz</h1>
    <p id="para-1">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Dolore, libero!</p>
    <p id="para-2">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Dolore, libero!</p>
    <p id="para-3">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Dolore, libero!</p>
</body>
</html>
