<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Abhay Pratap Singh">
    <title>Q3 - Image Showcase</title>
    <link rel="stylesheet" href="style03.css">
</head>
<body>
    <header>
        <h1>Image Showcase</h1>
        <p>Hover over any photo to see a smooth scale and overlay effect.</p>
    </header>

    <main class="gallery">
        <figure class="card">
            <div class="img-wrap">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=600&q=80" alt="Snowy mountain peaks">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain Peaks</figcaption>
        </figure>

        <figure class="card">
            <div class="img-wrap">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Tropical beach shoreline">
                <div class="overlay"></div>
            </div>
            <figcaption>Ocean Shore</figcaption>
        </figure>

        <figure class="card">
            <div class="img-wrap">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80" alt="Sunlight through forest trees">
                <div class="overlay"></div>
            </div>
            <figcaption>Forest Path</figcaption>
        </figure>

        <figure class="card">
            <div class="img-wrap">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Foggy green hills">
                <div class="overlay"></div>
            </div>
            <figcaption>Misty Hills</figcaption>
        </figure>

        <figure class="card">
            <div class="img-wrap">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=600&q=80" alt="Sunrise over a valley">
                <div class="overlay"></div>
            </div>
            <figcaption>Sunrise Valley</figcaption>
        </figure>

        <figure class="card">
            <div class="img-wrap">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80" alt="Lake reflecting mountains">
                <div class="overlay"></div>
            </div>
            <figcaption>Quiet Lake</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Abhay Pratap Singh</p>
    </footer>
</body>
</html>
