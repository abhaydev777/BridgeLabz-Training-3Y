<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Abhay Pratap Singh">
    <title>Q5 - Styled Button Collection</title>
    <link rel="stylesheet" href="style05.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
        <p>Primary, Secondary, Outline, and Disabled button styles with hover, active, and focus states.</p>
    </header>

    <main>
        <section class="button-row">
            <div class="btn-group">
                <span class="label">Primary</span>
                <button class="btn btn-primary" type="button">Save Changes</button>
            </div>

            <div class="btn-group">
                <span class="label">Secondary</span>
                <button class="btn btn-secondary" type="button">View Details</button>
            </div>

            <div class="btn-group">
                <span class="label">Outline</span>
                <button class="btn btn-outline" type="button">Learn More</button>
            </div>

            <div class="btn-group">
                <span class="label">Disabled</span>
                <button class="btn btn-primary" type="button" disabled>Unavailable</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Abhay Pratap Singh</p>
    </footer>
</body>
</html>
