<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Abhay Pratap Singh">
    <title>Q6 - CSS Animations</title>
    <link rel="stylesheet" href="style06.css">
</head>
<body>
    <header>
        <h1>CSS Animation Demo</h1>
        <p>Three continuous animations using @keyframes.</p>
    </header>

    <main class="stage">
        <section class="anim-block">
            <h2>Sliding Box</h2>
            <div class="track">
                <div class="slide-box"></div>
            </div>
        </section>

        <section class="anim-block">
            <h2>Bouncing Ball</h2>
            <div class="bounce-area">
                <div class="ball"></div>
            </div>
        </section>

        <section class="anim-block">
            <h2>Pulsing Banner</h2>
            <p class="pulse-banner">CSS Animations!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Abhay Pratap Singh</p>
    </footer>
</body>
</html>
