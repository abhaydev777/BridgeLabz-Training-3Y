<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Abhay Pratap Singh">
    <title>Q7 - UI Components</title>
    <link rel="stylesheet" href="style07.css">
</head>
<body>
    <main>
        <section class="panel">
            <header class="panel-header">
                <h1>Find Courses</h1>
                <p>Search and filter the catalog below.</p>
            </header>

            <form class="controls">
                <div class="search-wrap">
                    <label for="search">Search</label>
                    <input type="search" id="search" name="search" placeholder="Search for a topic...">
                </div>

                <div class="select-wrap">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="">All categories</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="js">JavaScript</option>
                        <option value="design">Web Design</option>
                    </select>
                </div>

                <div class="actions">
                    <button class="btn btn-search" type="submit">Search</button>
                    <button class="btn btn-clear" type="reset">Clear</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Abhay Pratap Singh</p>
    </footer>
</body>
</html>
