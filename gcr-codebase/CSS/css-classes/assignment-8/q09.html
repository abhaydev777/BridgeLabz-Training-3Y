<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Abhay Pratap Singh">
    <title>Q9 - Combined Effects</title>
    <link rel="stylesheet" href="style09.css">
</head>
<body>
    <header>
        <h1>Combined Effects Demo</h1>
        <p>Hover and click to see transitions, transforms, and shadow elevation.</p>
    </header>

    <main class="effects-row">
        <article class="action-card">
            <h2>Action Card</h2>
            <p>Hover to lift and scale. Click for a press effect.</p>
            <button type="button" class="card-btn">Try Me</button>
        </article>

        <article class="action-card accent">
            <h2>Quick Start</h2>
            <p>Combines translateY, scale, and a stronger shadow on hover.</p>
            <button type="button" class="card-btn">Open</button>
        </article>

        <div class="icon-badge" title="Notification">
            <span class="icon">★</span>
            <span class="badge-label">Featured</span>
        </div>

        <div class="icon-badge alt" title="Messages">
            <span class="icon">✉</span>
            <span class="badge-label">Inbox</span>
        </div>

        <span class="pill">New</span>
        <span class="pill pill-green">Popular</span>
        <span class="pill pill-orange">Updated</span>
    </main>

    <footer>
        <p>&copy; 2026 Abhay Pratap Singh</p>
    </footer>
</body>
</html>
