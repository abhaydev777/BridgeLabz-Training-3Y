<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Abhay Pratap Singh">
  <title>Product Gallery</title>
  <link rel="stylesheet" href="style02.css">
</head>
<body>
  <header>
    <h1>Product Gallery</h1>
    <p>Handpicked items for everyday use</p>
  </header>

  <main class="gallery">
    <article class="card">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=300&fit=crop" alt="Classic wristwatch">
      <h2>Classic Watch</h2>
      <p class="price">$89.00</p>
    </article>
    <article class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=300&fit=crop" alt="Wireless headphones">
      <h2>Wireless Headphones</h2>
      <p class="price">$129.00</p>
    </article>
    <article class="card">
      <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&h=300&fit=crop" alt="Sunglasses">
      <h2>Aviator Sunglasses</h2>
      <p class="price">$45.00</p>
    </article>
    <article class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop" alt="Running shoes">
      <h2>Running Shoes</h2>
      <p class="price">$110.00</p>
    </article>
    <article class="card">
      <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400&h=300&fit=crop" alt="Instant camera">
      <h2>Instant Camera</h2>
      <p class="price">$75.00</p>
    </article>
    <article class="card">
      <img src="https://images.unsplash.com/photo-1484704849700-f032a568e944?w=400&h=300&fit=crop" alt="Portable speaker">
      <h2>Portable Speaker</h2>
      <p class="price">$59.00</p>
    </article>
    <article class="card">
      <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=400&h=300&fit=crop" alt="Sneakers">
      <h2>Urban Sneakers</h2>
      <p class="price">$95.00</p>
    </article>
    <article class="card">
      <img src="https://images.unsplash.com/photo-1560343090-f0409e92791a?w=400&h=300&fit=crop" alt="Leather bag">
      <h2>Leather Tote</h2>
      <p class="price">$140.00</p>
    </article>
  </main>
</body>
</html>
