<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Abhay Pratap Singh">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style08.css">
</head>
<body>
  <header>
    <h1>Travel Photo Gallery</h1>
    <p>Moments captured around the world</p>
  </header>

  <main class="gallery">
    <figure>
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500&h=400&fit=crop" alt="Mountain landscape">
      </div>
      <figcaption>Alpine Peaks</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&h=400&fit=crop" alt="Tropical beach">
      </div>
      <figcaption>Ocean Shore</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=500&h=400&fit=crop" alt="City skyline at night">
      </div>
      <figcaption>City Lights</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&h=400&fit=crop" alt="Foggy forest">
      </div>
      <figcaption>Misty Woods</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=500&h=400&fit=crop" alt="Desert dunes">
      </div>
      <figcaption>Desert Dunes</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&h=400&fit=crop" alt="Sunlit valley">
      </div>
      <figcaption>Golden Valley</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=500&h=400&fit=crop" alt="Lake reflection">
      </div>
      <figcaption>Still Lake</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500&h=400&fit=crop" alt="Coastal cliffs">
      </div>
      <figcaption>Cliff Coast</figcaption>
    </figure>
  </main>
</body>
</html>
