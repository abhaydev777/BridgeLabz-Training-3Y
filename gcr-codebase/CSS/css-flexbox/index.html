<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Flex-Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .container {
            background-color: beige;
            /* border: 2px solid black; */
            width: 100vw;
            height: 100vh;
            /* flex */
            display: flex;
            justify-content: space-between;
            /* flex-wrap: wrap; */
        }

        .box {
            height: 200px;
            width: 200px;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
        }

        #box1 {
            background-color: #601D49;
            /* flex-shrink: 4; */
            flex-grow: 5;
        }

        #box2 {
            background-color: #BD5579;
            align-self: center;
        }

        #box3 {
            background-color: #EA9D9D;
            order: 100;
            align-self: center;
        }

        #box4 {
            background-color: #FA8112;
            order: 99;
            align-self: end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">Box 1</div>
        <div class="box" id="box2">Box 2</div>
        <div class="box" id="box3">Box 3</div>
        <div class="box" id="box4">Box 4</div>
    </div>
    <nav></nav>
    <main></main>
    <footer></footer>   
</body>
</html>
