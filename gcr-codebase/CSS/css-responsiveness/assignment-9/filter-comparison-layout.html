<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Abhay Pratap Singh">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
  <header>
    <h1>Before &amp; After Filter Comparison</h1>
    <p>Original on the left. Hover the filtered image on the right to clear the effect.</p>
  </header>

  <main>
    <section class="comparison" aria-label="Before and after image comparison">
      <figure class="before">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&h=400&fit=crop" alt="Original landscape photo without filter">
        <figcaption>Before — Original</figcaption>
      </figure>

      <figure class="after">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&h=400&fit=crop" alt="Same landscape with contrast and brightness filters" class="filtered-image">
        <figcaption>After — Contrast + Brightness</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Abhay Pratap Singh — Assignment 9</p>
  </footer>
</body>
</html>
