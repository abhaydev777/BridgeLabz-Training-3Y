<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Abhay Pratap Singh">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header>
    <h1>Image Filter Gallery</h1>
    <p>Hover over any image to remove its filter effect.</p>
  </header>

  <main>
    <section class="gallery" aria-label="Filtered image gallery">
      <figure>
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300&fit=crop" alt="Mountain landscape with blur filter" class="filter-blur">
        <figcaption>Blur Filter</figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=400&h=300&fit=crop" alt="Forest scenery with grayscale filter" class="filter-grayscale">
        <figcaption>Grayscale Filter</figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400&h=300&fit=crop" alt="Sunlit trees with sepia filter" class="filter-sepia">
        <figcaption>Sepia Filter</figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400&h=300&fit=crop" alt="Foggy hills with brightness filter" class="filter-brightness">
        <figcaption>Brightness Filter</figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=400&h=300&fit=crop" alt="Valley view with contrast filter" class="filter-contrast">
        <figcaption>Contrast Filter</figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&h=300&fit=crop" alt="Lake reflection with hue-rotate filter" class="filter-hue">
        <figcaption>Hue-Rotate Filter</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Abhay Pratap Singh — Assignment 9</p>
  </footer>
</body>
</html>
