<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 10 - Contact Form</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form action="#" method="post">
        <label for="contact-name">Full Name:</label>
        <input type="text" id="contact-name" name="full_name" placeholder="Enter your full name" required>
        <br>
        <label for="contact-email">Email:</label>
        <input type="email" id="contact-email" name="email" placeholder="Enter your email address" required>
        <br>
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Enter a subject" required>
        <br>
        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Write your message" required></textarea>
        <br>
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
