<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 17 - Form Target Frame</title>
</head>
<body>
    <h1>Submit a Form</h1>
    <form action="result.html" method="get" target="result_frame">
        <label for="form-text">Text:</label>
        <input type="text" id="form-text" name="text">
        <button type="submit">Submit</button>
    </form>
    <iframe name="result_frame" title="Form result" width="100%" height="150"></iframe>
</body>
</html>
