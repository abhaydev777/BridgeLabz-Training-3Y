<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 19 - Secure Form Settings</title>
</head>
<body>
    <h1>Secure Information Form</h1>
    <form action="#" method="post" autocomplete="off">
        <label for="secure-name">Name:</label>
        <input type="text" id="secure-name" name="name" required>
        <br>
        <label for="secure-email">Email:</label>
        <input type="email" id="secure-email" name="email" required>
        <br>
        <label for="secure-code">Security Code:</label>
        <input type="password" id="secure-code" name="security_code" required>
        <br>
        <button type="submit">Submit</button>
    </form>
    <p>Disabling autocomplete can improve security on sensitive forms by reducing the chance that private values are stored or suggested by the browser.</p>
</body>
</html>
