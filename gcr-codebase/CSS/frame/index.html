<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frames</title>
    <style>
      h2 {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        font-size: 30px;
      }

      img {
        width: 55px;
        height: 55px;
        border-radius: 50%;
      }

      video {
        border-radius: 20px;
      }

      .container {
        display: flex;
        gap: 15px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <!-- Add Logo -->
    <h2>Audio</h2>
    <div class="container">
      <img src="logo.jpg" alt="logo" />
      <!-- Audio -->
      <audio controls src="./audio.mp3" type="audio/mp3"></audio>
    </div>

    <br />
    <br />

    <!-- Video -->
    <h2>Video</h2>
    <!-- <video src="./video.mp4" height="500px controls"></video> -->
    <video
      src="./video.mp4"
      height="450px"
      type="stock video"
      controls
      loop
    ></video>

    <br />
    <br />

    <!-- iframe -->
    <h2>iframe youtube</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/UWgM09MV9zY?si=Y9dySxHpg5MbY8Xb"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <iframe src="./boxmodel.html" frameborder="0" width="300px"></iframe>

    <!-- webpage inside iframe -->
     <h2>Webpage inside iframe</h2>
    <iframe src="./boxmodel.html" frameborder="0""></iframe>

    <!-- maps inside iframe -->
     <h2>maps inside ifram</h2>
     <iframe
  id="inlineFrameExample"
  title="Inline Frame Example"
  width="300"
  height="200"
  src="https://www.openstreetmap.org/export/embed.html?bbox=-0.004017949104309083%2C51.47612752641776%2C0.00030577182769775396%2C51.478569861898606&amp;layer=mapnik">
</iframe>
  </body>
</html>
