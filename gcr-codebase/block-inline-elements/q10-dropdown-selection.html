<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Selection</title>
</head>
<body>
    <h1>Select Your Location</h1>
    
    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="India" selected>India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
        </select>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="Maharashtra" selected>Maharashtra</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Delhi">Delhi</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="Mumbai" selected>Mumbai</option>
            <option value="Pune">Pune</option>
            <option value="Nagpur">Nagpur</option>
            <option value="Aurangabad">Aurangabad</option>
        </select>
        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="Gateway of India" selected>Gateway of India</option>
            <option value="Marine Drive">Marine Drive</option>
            <option value="Taj Mahal">Taj Mahal</option>
            <option value="Hawa Mahal">Hawa Mahal</option>
        </select>
        <br><br>
    </form>

    <p>You have selected: <strong>India, Maharashtra, Mumbai, Gateway of India</strong></p>
</body>
</html>
