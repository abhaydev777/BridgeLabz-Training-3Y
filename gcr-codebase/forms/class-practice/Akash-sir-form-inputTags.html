<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Input Tags</title>
</head>
<body>
    <form action="">
        <label for="radio1">Male</label>
        <input type="radio" id="radio1" name="radio1">
        <label for="radio2">Female</label>
        <input type="radio" id="radio2" name="radio1">
        <label for="radio3">Others</label>
        <input type="radio" id="radio3" name="radio1">
        <br />
        <br />
        <label for="checkbox1">English</label>
        <input type="checkbox" name="checkbox1" id="checkbox1">
        <label for="checkbox2">Hindi</label>
        <input type="checkbox" name="checkbox2" id="checkbox2">
        <label for="checkbox3">Spanish</label>
        <input type="checkbox" name="checkbox3" id="checkbox3">
        <br />
        <br />
        <label for="file">Upload Now: </label>
        <input type="file" id="file" name="file">
        <br />
        <br />
        <input type="image" src="submit-button.png" alt="Submit Form" width="150" height="50">
        <br />
        <br />
        <label for="password">Enter Password: </label>
        <input type="password" id="password">
        <br />
        <br />
        <label for="datepicker">Choose Date: </label>
        <input type="date" id="datepicker" name="datepicker">
        <br />
        <br />
        <input type="reset">
    </form>
</body>
</html>
