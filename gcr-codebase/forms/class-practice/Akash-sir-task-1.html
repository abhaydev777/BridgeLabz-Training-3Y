<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML-FORMS-TASK-1</title>
  </head>
  <body>
    <fieldset>
      <legend>Student Registration Form</legend>
      <form action="">
        <h2>Personal Details</h2>
        <label for="email">Enter ID: </label>
        <input type="email" id="email" placeholder="Enter your ID" />
        <br />
        <br />
        <label for="password">Enter Password: </label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
        />
        <br />
        <br />
        <label for="datepicker">Choose Date: </label>
        <input type="date" id="datepicker" name="datepicker" />
        <br />
        <br />
        <label for="radio1">Male</label>
        <input type="radio" id="radio1" name="radio1" />
        <label for="radio2">Female</label>
        <input type="radio" id="radio2" name="radio1" />
        <label for="radio3">Others</label>
        <input type="radio" id="radio3" name="radio1" />
        <br />
        <br />
        <label for="checkbox1">English</label>
        <input type="checkbox" name="checkbox1" id="checkbox1" />
        <label for="checkbox2">Hindi</label>
        <input type="checkbox" name="checkbox2" id="checkbox2" />
        <label for="checkbox3">Spanish</label>
        <input type="checkbox" name="checkbox3" id="checkbox3" />
        <br />
        <br />
        <label for="file">Upload a File: </label>
        <input type="file" id="file" name="file" />
        <br />
        <br />
        <!-- select -->
        <label for="selector1">Choose your dish: </label>
        <select name="dishes" id="selector1">
            <option value="select">--Select--</option>
          <option value="maggie">Maggie</option>
          <option value="kurkure">Kurkure</option>
          <option value="chips">Chips</option>
        </select>
        <br />
        <br />
        <!-- text area -->
        <label for="textarea1">Enter Message: </label>
        <br />
        <textarea name="textarea1" id="textarea1" rows="10" cols="30">
        </textarea>
        <br />
        <br />
        <input type="image" src="submit-button.png" alt="Submit Form" width="150" height="50">
        <br />
        <br />
        <input type="submit">
        <input type="reset">
      </form>
    </fieldset>
  </body>
</html>
